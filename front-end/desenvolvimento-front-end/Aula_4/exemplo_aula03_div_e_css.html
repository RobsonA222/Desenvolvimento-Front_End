<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Div Com Css</title>
    <style>
        
       
        div{


            font: size 10px; ;
            text-align: center;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;

            
        }
        #principal
        {
            background-color: rgb(175, 196, 255);
            border-top: 5px solid rgb(1, 5, 252);
            color:  rgb(0, 0, 0);


        }
        #Secundaria{
            background-color: rgb(14, 247, 45);
            border-top: 5px solid rgb(1, 102, 9);
            color: rgb(3, 3, 3);
        }
        hr{
            border: rgb(255, 0, 0);
            border-top: 2px solid rgb(2, 2, 2);
            width: 120%;
        }
        #Terceira{
            background-color: aliceblue;
            border-top: 5px solid rebeccapurple;
            color: black;
        }


    </style>
</head>
<body>

    <h1>CSS COM DIVS</h1>
    <div id="principal">
        
        Está é a primeira linha.
        </br>
        E essa é a segunda linha
        </br>
    
    </div>
    <hr/>
    <div id="Secundaria">
        Está é outra divisão da pagina
    </br>
        E Está começa uma nova linha.
    </br>
    </div>
    <hr/>
    <div id="Terceira">
        A terceira linha é essa
    </br>
        E aqui é para uma nova linha

    </div>

</body>
</html>
