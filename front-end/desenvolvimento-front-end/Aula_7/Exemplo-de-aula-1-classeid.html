<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de classe e id</title>
    <style>

        
        body{

            background-color: rgba(111, 113, 119, 0.377);
            
        }
        .caixa1{
            background-color: rgba(127, 6, 241, 0.644);
            padding: 40px 20px ;
            border: 3px solid rgba(20, 20, 20, 0.918);
            color: rgb(255, 255, 255);
            text-align: center;
            margin-top: 30px;
            margin-bottom: 20px;
            margin-left: 10px;
            margin-right: 30px;
            border-radius: 20px;
            box-shadow: 20px;
        }

        #aviso{
            width: 150px;
            height: 100px;
        }

        h1{

            color: aliceblue;
        }
  



    </style>
</head>
<body>
    <h1>Exemplo de Classe e id</h1>
    <p>
        Parágrafo comum da página.
    </p>

    <div>Está é uma div sem formatação.</div>

    <br>

    <div class="caixa1" id="aviso">Está div utiliza a classe caixa e o identificador aviso.</div>

    <br>

    <span>Este é um span sem formatação <br></span>

    <br>

    <span class="caixa1"> Este é um span utilizando a classe caixa</span>




</body>
</html>
