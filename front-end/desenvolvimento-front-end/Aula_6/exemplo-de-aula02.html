<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de classes e CSS interno</title>
    <style>
    .titulo{
        color: rgb(6, 12, 12);
        text-align: center;
    }
    .caixa01{
        background-color: rgb(1, 173, 173);
        border: 2px solid rgb(12, 12, 172);
        padding: 20px;
        margin: 20px auto;
    }
    .caixa02{
        background-color: azure;
        border: 2px solid darkblue;
        padding: 20px;
        margin: 20px auto;
    }
    .destaque01 {
        color: rgb(5, 121, 223);
        font-weight: bold;
    }
    .destaque02 {
        color: aliceblue;
        background-color: rgb(31, 204, 204);
        font-style: italic;
        padding: 10px;
    }
    </style>
</head>
<body>

    <h1 class="titulo">Aprendendo classe em CSS</h1>
    <div id="caixa01">
        <p>Estou aprendendo a utilizar classes para personalizar os elementos
            de uma página
        </p>
        <br>
        <p class="destaque01">
            Este páragrafo utiliza a classe destaque01
        </p>
        <p class="destaque02">
            Este páragrafo utiliza a classe destaque02
        </p>
    </div>
    <div class="caixa02">
        <p>
            Este páragrafo não utiliza nenhuma classe
        </p>
       
    </div>


</body>
</html>
