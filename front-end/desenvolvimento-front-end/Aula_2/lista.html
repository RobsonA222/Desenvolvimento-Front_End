<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos de listas</title>
</head>
<body>
    <h1>Elentos de listas</h1>
    <p>
        As lista em HTML são usadas para 
        organizar informações em uma sequência
    </p>
    <h2>Lista Ordenadas</h2>
    <ol>
        <li>Primeiro item</li>
        <Li>Segundo item</Li>
        <li>Terceiro item</li>
    </ol>
    <h2>Lista Não Ordenadas</h2>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>
</body>
</html>
