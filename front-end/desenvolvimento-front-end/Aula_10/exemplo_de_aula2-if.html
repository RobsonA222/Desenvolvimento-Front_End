<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horário e previsão do tempo</title>
</head>
<body>
    <h1>Horário e previsão do tempo</h1>
    <p> O programa mostrar um saudação 
        e uma recomendaçao de acordo com o clima.
    </p>

    <script>
        const data_hora = new Date();
        const hora = data_hora.getHours();
        
        let previsao_tempo = prompt("Como está o tempo, Digite chuvoso ou ensolarado?");

        previsao_tempo = previsao_tempo.toLowerCase().trim();

        if (hora<12){
            alert("Bom dia! Bora acordar vagabundo")
            if(previsao_tempo === "ensolarado")
            alert("Use protetor solar!");
        
        else{
            alert("O dia está chuvoso, não esqueça o guarda chuva!");
        }
        }
        else if (hora<18){
            alert("Boa tarde! Meu guerreiro");
            if(previsao_tempo === "ensolarado")
            alert("Use protetor solar!");
        
        else{
            alert("O dia está chuvoso, não esqueça o guarda chuva!");
        }
            
        } 
        else{
            alert("Boa noite!Meu companheiro");
            if(previsao_tempo === "ensolarado")
            alert("Use protetor solar!");
        
        else{
            alert("O dia está chuvoso, não esqueça o guarda chuva!");
        }
        }       






    </script>
</body>
</html>
